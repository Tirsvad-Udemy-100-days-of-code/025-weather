[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weather"
version = "0.1.0"
description = "Reading CSV weather data with the csv library and pandas, from Udemy's 100 Days of Code (day 25): DataFrame and Series, average, maximum, row selection, create and export."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
keywords = ["csv", "pandas", "weather", "udemy", "100-days-of-code", "dataframe"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
# The csv part runs on the standard library only; pandas is an optional extra.
dependencies = []

[project.optional-dependencies]
pandas = [
    "pandas>=2.2",
]
dev = [
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/025-weather"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weather = ["weather_data.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["framework", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
